<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#141e36"/>
    </linearGradient>

    <!-- Mesh Glow Gradient -->
    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlow2" cx="85%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#a855f7;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#6366f1;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Chart Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .floating-card-3 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .pulse-grid {
        animation: pulseLight 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 12 8;
        animation: dashFlow 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#meshGlow1)"/>
  <rect width="1200" height="400" rx="16" fill="url(#meshGlow2)"/>
  <rect width="1200" height="400" rx="16" fill="url(#accentGlow)"/>

  <!-- Border -->
  <rect width="1196" height="396" x="2" y="2" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.65"/>

  <!-- Background Animated Grid -->
  <g opacity="0.12" class="pulse-grid">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Forecast Sparklines in Background -->
  <g opacity="0.45" filter="url(#glow)">
    <!-- Predictive Forecast Wave 1 -->
    <path class="flow-line" d="M 50 320 Q 200 240 380 280 T 720 200 T 1000 130 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <!-- Historical Trend Wave 2 -->
    <path d="M 50 340 Q 220 300 410 310 T 750 250 T 1020 180 T 1150 140" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Glowing Particles / Data Nodes with Animation -->
  <g opacity="0.8">
    <circle cx="380" cy="280" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="200" r="5" fill="#6366f1">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="130" r="5" fill="#34d399">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="90" r="6" fill="#38bdf8">
      <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right Side Interactive Telemetry Floating Metric Cards (Midground, offset from title) -->
  <g class="floating-card-1" opacity="0.95">
    <rect x="880" y="45" width="260" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="910" cy="82" r="14" fill="#0369a1" fill-opacity="0.4"/>
    <text x="910" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">🎯</text>
    <text x="935" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">LEAD SCORING AI</text>
    <text x="935" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">94.8% <tspan font-size="12" fill="#34d399" font-weight="500">↑ High Intent</tspan></text>
  </g>

  <g class="floating-card-2" opacity="0.95">
    <rect x="840" y="145" width="280" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="870" cy="182" r="14" fill="#4338ca" fill-opacity="0.4"/>
    <text x="870" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#818cf8" text-anchor="middle">📈</text>
    <text x="895" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">REVENUE FORECAST</text>
    <text x="895" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#e0e7ff">$4.82M <tspan font-size="12" fill="#34d399" font-weight="500">+28.4% YoY</tspan></text>
  </g>

  <g class="floating-card-3" opacity="0.95">
    <rect x="890" y="245" width="250" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="920" cy="282" r="14" fill="#065f46" fill-opacity="0.4"/>
    <text x="920" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#34d399" text-anchor="middle">🛡️</text>
    <text x="945" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">CHURN PREDICTION</text>
    <text x="945" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#34d399">1.8% <tspan font-size="12" fill="#94a3b8" font-weight="500">Low Risk Tier</tspan></text>
  </g>

  <!-- FOREGROUND: Main Branding Header & Typography (Always on Top) -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 60)">
      <rect width="280" height="30" rx="15" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <circle cx="16" cy="15" r="5" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.8">CURATED REVOPS &amp; AI DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
      Awesome In-CRM
    </text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Predictive Analytics
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Sales Forecasting • Lead Scoring • Churn Prevention • Revenue Intelligence
    </text>
    <text x="0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Comparing leading enterprise SaaS solutions and open-source machine learning stacks.
    </text>

    <!-- Category Highlights Pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g>
        <rect width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="80" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38bdf8" text-anchor="middle">🎯 Lead Scoring</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(172, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#818cf8" text-anchor="middle">📈 Sales Forecasting</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(364, 0)">
        <rect width="175" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="87" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#34d399" text-anchor="middle">🛡️ Churn Analysis</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(551, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="82" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f472b6" text-anchor="middle">⚡ Open-Source ML</text>
      </g>
    </g>
  </g>
</svg>
